<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./src/output.css">
    <title>CineFind</title>
</head>

<body class="bg-[#10131C]">

    <header class="container p-5 flex justify-between items-center fixed z-9 bg-[#10131C]">
        <h3 class="text-[#9CA3AF] text-[12px] sm:text-[16px]">MOVIE EXPLORER</h3>
        <div class="brand flex gap-2 items-center">
            <h2 class="text-[18px] sm:text-[24px] font-semibold">CineFind</h2>
            <div class="logo bg-[#EAB308] p-1.5 rounded-lg">
                <img src="./imgs & icons/icons/cinema.svg" class="w-4" alt="cinema logo">
            </div>
        </div>
    </header>

    <main>
        <section class="hero flex flex-col gap-3 items-center pt-20 pb-14">
            <h1 class="text-[24px] sm:text-[36px] font-semibold">.Discover your next movie.</h1>
            <p class="text-[#9CA3AF] text-[12px] sm:text-[16px]">.Search for any movie and explore its details.</p>
        </section>
        <form
            class="search w-[90%] sm:w-[70%] mx-auto flex justify-between items-center bg-[#202634] rounded-xl py-4 pl-4">
            <div class="searching flex gap-2 w-full">
                <button type="submit" class="cursor-pointer"><img src="./imgs & icons/icons/search.svg" class="w-4"
                        alt="seearch logo"></button>
                <input type="text" placeholder="Search movie title..." name="movie"
                    class="w-full placeholder:text-[13px] sm:placeholder:text-[16px]">
            </div>
            <button type="submit"
                class="bg-[#EAB308] rounded-lg mr-2.5 sm:mr-3.5 px-1.5 sm:px-3.5 py-1 sm:py-2.5 text-black font-medium cursor-pointer hover:opacity-60 transition-all duration-300">Search</button>
        </form>
        <section class="movies-section w-[90%] sm:w-[70%] mx-auto flex flex-col gap-4 justify-center py-8">
            <h3 class="font-semibold text-[20px] pl-1">movies</h3>
            <div class="movies w-full flex flex-col gap-8">
            </div>
        </section>
    </main>

    <footer>
        <button
                class="show-more text-white text-[16px] leading-7 border border-white rounded-[80px] px-10 py-2 mt-4 mb-12 font-medium flex mx-auto hover:cursor-pointer hover:bg-blue-500 hover:text-white hover:border-white transition-all duration-300">Show
                More</button>
    </footer>

    <script src="./javascript/script.js" type="module"></script>
</body>

</html>
